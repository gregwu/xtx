[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-xtx"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "polars>=1.20",
  "pyarrow>=17",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "torch>=2.4",
  "pyyaml>=6",
  "joblib>=1.4"
]

[project.scripts]
mini-xtx = "mini_xtx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
